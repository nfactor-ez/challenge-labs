user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        # Challenge: What port is Nginx configured to listen on?
        listen       8888;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
        }

        # Flag is revealed when you discover the right port
        location /flag {
            return 200 'FLAG{n1nx_l1st3ns_0n_p0rt_8888}\n';
            add_header Content-Type text/plain;
        }
    }
}
