services:

  # ── PostgreSQL database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       challengelabs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d challengelabs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Challenge images (built locally, used by the API to spawn containers) ─────
  # Builds the challenge Docker image and immediately exits.
  # The API uses the Docker socket to spin up challenge containers on demand.
  challengelabs-nginx:
    build:
      context: ./challenges/nginx-port-discovery
      dockerfile: Dockerfile
    image: challengelabs-nginx:latest
    entrypoint:   ["true"]              # exits immediately after build; no container stays running
    restart: "no"

  # ── ChallengeLabs API server ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cl_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV:                             development
      SERVER_PORT:                     8080
      STORE:                           postgres
      DB_HOST:                         postgres
      DB_PORT:                         5432
      DB_USER:                         postgres
      DB_PASSWORD:                     postgres
      DB_NAME:                         challengelabs
      DB_SSLMODE:                      disable
      JWT_SECRET:                      ${JWT_SECRET:-change-me-in-production}
      DOCKER_HOST:                     unix:///var/run/docker.sock
      CONTAINER_MAX_LIFETIME_MINUTES:  60
      CONTAINER_IDLE_TIMEOUT_MINUTES:  15
      ALLOWED_ORIGINS:                 http://localhost:3000,http://localhost:5173,http://localhost:5174
      SMTP_HOST:                       smtp-relay.brevo.com
      SMTP_PORT:                       587
      SMTP_USER:                       your-smtp-user@smtp-brevo.com
      SMTP_PASSWORD:                   your-smtp-password-here
      SMTP_FROM:                       your-email@yourdomain.com
      BREVO_API_KEY:                   your-brevo-api-key-here
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cl_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:

