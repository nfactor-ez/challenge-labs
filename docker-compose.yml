services:

  # ── ChallengeLabs API server ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cl_api
    restart: unless-stopped
    environment:
      ENV:                             development
      SERVER_PORT:                     8080
      STORE:                           postgres
      # host.docker.internal resolves to the Windows host — cl_postgres is
      # exposed there on port 5433 (mapped from its internal 5432)
      DB_HOST:                         host.docker.internal
      DB_PORT:                         5433
      DB_USER:                         postgres
      DB_PASSWORD:                     postgres
      DB_NAME:                         challengelabs
      DB_SSLMODE:                      disable
      JWT_SECRET:                      ${JWT_SECRET:-change-me-in-production}
      DOCKER_HOST:                     unix:///var/run/docker.sock
      CONTAINER_MAX_LIFETIME_MINUTES:  60
      CONTAINER_IDLE_TIMEOUT_MINUTES:  15
      ALLOWED_ORIGINS:                 http://localhost:3000,http://localhost:5173,http://localhost:5174
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── React frontend (Nginx) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cl_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
