<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChallengeLabs — Build and solve challenges in isolated Docker containers." />
    <meta name="theme-color" content="#0c0c0f" />
    <title>ChallengeLabs</title>
    <!-- Anti-flash: set theme before React hydrates -->
    <script>
      (function() {
        var t = localStorage.getItem('cl_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
